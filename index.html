<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса доставки</title>

  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet (карта) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; }
    .panel {
      padding: 12px;
      background: rgba(255,255,255,0.95);
      border-top: 1px solid #eaeaea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      border: none; border-radius: 10px;
      padding: 12px 14px; font-size: 16px;
      cursor: pointer;
    }
    .btn-primary { background: #2ea6ff; color: #fff; }
    .btn-ghost { background: #f3f4f6; color: #111; }
    .hint { font-size: 13px; color: #555; margin-top: 6px; }
    .addr { font-size: 14px; margin-top: 8px; color: #111; }
    .badge { font-size: 12px; background:#eef6ff; padding:4px 8px; border-radius:999px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <div class="row">
        <span class="badge" id="coordsBadge">Точка не выбрана</span>
        <button class="btn btn-ghost" id="btnMyLoc">📍 Моё местоположение</button>
        <button class="btn btn-primary" id="btnSend" disabled>✅ Подтвердить адрес</button>
      </div>
      <div class="addr" id="addrText"></div>
      <div class="hint">
        Нажмите на карту, чтобы поставить метку. Затем нажмите “Подтвердить адрес”.
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // Карта
    const map = L.map('map', { zoomControl: true });

    // OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Начальная позиция (если Telegram передаст гео — используем, иначе Европа)
    const fallbackCenter = [52.3702, 4.8952]; // Amsterdam
    map.setView(fallbackCenter, 12);

    let marker = null;
    let picked = null; // {lat, lon, address}

    const coordsBadge = document.getElementById('coordsBadge');
    const addrText = document.getElementById('addrText');
    const btnSend = document.getElementById('btnSend');
    const btnMyLoc = document.getElementById('btnMyLoc');

    function setPicked(lat, lon) {
      picked = { lat, lon, address: "" };

      if (marker) marker.remove();
      marker = L.marker([lat, lon], { draggable: true }).addTo(map);

      marker.on('dragend', async () => {
        const p = marker.getLatLng();
        await updatePick(p.lat, p.lng, true);
      });

      updateUI();
      reverseGeocode(lat, lon);
      btnSend.disabled = false;
    }

    async function updatePick(lat, lon, moveMap) {
      picked = { lat, lon, address: "" };
      if (marker) marker.setLatLng([lat, lon]);
      if (moveMap) map.panTo([lat, lon]);
      updateUI();
      reverseGeocode(lat, lon);
      btnSend.disabled = false;
    }

    function updateUI() {
      if (!picked) {
        coordsBadge.textContent = "Точка не выбрана";
        addrText.textContent = "";
        return;
      }
      coordsBadge.textContent = `Координаты: ${picked.lat.toFixed(6)}, ${picked.lon.toFixed(6)}`;
      if (picked.address) {
        addrText.textContent = `Адрес: ${picked.address}`;
      } else {
        addrText.textContent = "Адрес: (определяем...)";
      }
    }

    map.on('click', async (e) => {
      await updatePick(e.latlng.lat, e.latlng.lng, false);
      if (!marker) setPicked(e.latlng.lat, e.latlng.lng);
    });

    // Реверс-геокодинг через Nominatim (OpenStreetMap)
    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
        const res = await fetch(url, {
          headers: { 'Accept': 'application/json' }
        });
        if (!res.ok) throw new Error('reverse failed');
        const data = await res.json();
        if (picked) {
          picked.address = data.display_name || "";
          updateUI();
        }
      } catch (e) {
        // если не получилось — просто оставим адрес пустым
        if (picked) {
          picked.address = "";
          updateUI();
        }
      }
    }

    // “Моё местоположение” через браузерный гео API
    btnMyLoc.addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Геолокация недоступна на этом устройстве.");
        return;
      }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.setView([lat, lon], 16);
        if (!marker) setPicked(lat, lon);
        await updatePick(lat, lon, true);
      }, () => {
        alert("Не удалось получить геопозицию. Проверьте разрешения.");
      }, { enableHighAccuracy: true, timeout: 8000 });
    });

    // Отправка в бота
    btnSend.addEventListener('click', () => {
      if (!picked) return;

      const payload = {
        lat: picked.lat,
        lon: picked.lon,
        address: picked.address || "",
        map_link: `https://maps.google.com/?q=${picked.lat},${picked.lon}`
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        // если открыли в обычном браузере (не из Telegram)
        alert("Откройте эту страницу из Telegram-кнопки в боте.");
      }
    });
  </script>
</body>
</html>
