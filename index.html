<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса доставки</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; }

    .panel {
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #eaeaea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #2ea6ff; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      cursor: pointer;
      background: #f3f4f6;
      color: #111;
    }

    .btn-primary { background: #2ea6ff; color: #fff; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.35; }
    .addr { font-size: 14px; margin-top: 6px; color: #111; }
    .badge { font-size: 12px; background:#eef6ff; padding:4px 8px; border-radius:999px; }

    .results {
      margin-top: 8px;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      max-height: 210px;
      overflow-y: auto;
      display: none;
      background: #fff;
    }

    .result {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.25;
    }
    .result:last-child { border-bottom: none; }
    .result:hover { background: #f8fafc; }

    .warn { margin-top: 8px; font-size: 13px; color: #a14; }
    .ok { margin-top: 8px; font-size: 13px; color: #0a7; }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <div class="row">
        <span class="badge" id="statusBadge">Введите адрес (СПб/ЛО)</span>
        <button class="btn" id="btnMyLoc">📍 Моё местоположение</button>
        <button class="btn btn-primary" id="btnConfirm" disabled>✅ Подтвердить адрес</button>
      </div>

      <div class="col">
        <input id="addrInput" placeholder="Улица, дом, корпус/строение..." autocomplete="off" />
        <div class="row">
          <input id="aptInput" placeholder="Квартира (обязательно)" style="max-width: 240px;" inputmode="numeric" />
          <button class="btn" id="btnClear">✖ Сброс</button>
        </div>
      </div>

      <div class="results" id="results"></div>

      <div class="addr" id="addrText"></div>
      <div class="warn" id="warn"></div>
      <div class="ok" id="ok"></div>

      <div class="hint">
        Подсказки показывают только существующие адреса (улица + дом + корпус/строение) в СПб и Лен. области.
        Подтвердить можно только после выбора подсказки и ввода квартиры.
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const warn = document.getElementById('warn');
    const ok = document.getElementById('ok');

    function showWarn(text) { warn.textContent = text || ""; }
    function showOk(text) { ok.textContent = text || ""; }

    if (tg) {
      tg.expand();
      tg.ready();
      tg.MainButton.setText("✅ Подтвердить адрес");
      tg.MainButton.hide();
    } else {
      showWarn("WebApp открыт не внутри Telegram. Откройте карту через кнопку в боте.");
    }

    // --- Map style (raster OSM)
    const style = {
      "version": 8,
      "sources": {
        "raster-tiles": {
          "type": "raster",
          "tiles": [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          "tileSize": 256,
          "attribution": "© OpenStreetMap contributors"
        }
      },
      "layers": [
        { "id": "osm", "type": "raster", "source": "raster-tiles" }
      ]
    };

    // Центр СПб
    const map = new maplibregl.Map({
      container: "map",
      style,
      center: [30.3141, 59.9386],
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    // Границы поиска СПб+ЛО (примерно)
    const VIEWBOX = { left: 28.7, top: 61.3, right: 35.7, bottom: 58.3 };

    let marker = null;

    // selectedPlace означает: пользователь выбрал подсказку (а не просто набрал текст)
    let selectedPlace = null; // {lat, lon, addressShort, addressFull, map_link}

    const statusBadge = document.getElementById('statusBadge');
    const addrText = document.getElementById('addrText');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnMyLoc = document.getElementById('btnMyLoc');
    const btnClear = document.getElementById('btnClear');
    const addrInput = document.getElementById('addrInput');
    const aptInput = document.getElementById('aptInput');
    const resultsBox = document.getElementById('results');

    function isInSpbOrLo(displayName) {
      const s = (displayName || "").toLowerCase();
      const isSpb =
        s.includes("санкт-петербург") || s.includes("санкт петербург") ||
        s.includes("sankt-peterburg") || s.includes("saint petersburg");
      const isLo =
        s.includes("ленинградская область") || s.includes("ленинградская обл") ||
        s.includes("leningrad oblast") || s.includes("leningradskaya oblast");
      return isSpb || isLo;
    }

    function normalizeApartment(value) {
      const v = (value || "").trim();
      if (!v) return "";
      if (!/\d/.test(v)) return "";
      return v;
    }

    function setMarker(lat, lon) {
      if (!marker) {
        marker = new maplibregl.Marker({ draggable: true })
          .setLngLat([lon, lat])
          .addTo(map);

        marker.on('dragend', async () => {
          // Если пользователь двигает маркер вручную — мы теряем "выбран из подсказки"
          // и требуем снова выбрать подсказку (как ты и хочешь: только подтверждённый адрес)
          selectedPlace = null;
          showWarn("Если изменили точку вручную — выберите адрес из подсказок заново (только СПб/ЛО).");
          updateUI();
        });
      } else {
        marker.setLngLat([lon, lat]);
      }
    }

    function updateUI() {
      const apt = normalizeApartment(aptInput.value);
      const hasSelection = !!selectedPlace;

      if (!hasSelection) {
        statusBadge.textContent = "Введите адрес и выберите из подсказок";
        addrText.textContent = "";
        btnConfirm.disabled = true;
        if (tg) tg.MainButton.hide();
        showOk("");
        return;
      }

      statusBadge.textContent = "Адрес выбран ✅ (введите квартиру)";
      addrText.textContent = "Адрес: " + selectedPlace.addressShort;

      const canConfirm = !!apt;
      btnConfirm.disabled = !canConfirm;

      if (tg) {
        if (canConfirm) tg.MainButton.show();
        else tg.MainButton.hide();
      }

      if (canConfirm) showOk("Можно подтвердить адрес ✅");
      else showOk("");
    }

    // ---- Формирование короткого адреса: "улица, дом, корпус/строение"
    function buildShortAddress(details) {
      // Nominatim addressdetails keys: road, house_number, building, block, neighbourhood, suburb, etc.
      // Нам нужно строго: road + house_number + (house_name/building/block)
      const a = details || {};
      const road = a.road || a.pedestrian || a.footway || a.cycleway || a.path || "";
      const house = a.house_number || "";

      // корпус/строение может быть в разных полях, Nominatim не стандартизирован идеально
      // попробуем несколько вариантов:
      const block = a.block || a.building || a.house_name || a.allotments || "";
      // иногда корпус может попасть в "residential" (редко) — но "residential" часто ЖК/район, поэтому осторожно:
      // не добавляем residential.

      let parts = [];
      if (road) parts.push(road);
      if (house) parts.push(house);

      // Добавим блок только если он выглядит как "к2", "корпус 2", "строение 1" и т.п.
      const b = (block || "").trim();
      if (b) {
        const bl = b.toLowerCase();
        const looksLikeBuilding =
          bl.includes("корп") || bl.includes("к") || bl.includes("стро") ||
          /\bк\d+\b/i.test(b) || /\bстр\d+\b/i.test(b) || /\bкорпус\b/i.test(b);

        if (looksLikeBuilding) parts.push(b);
      }

      const short = parts.join(", ").trim();
      return short;
    }

    // ---- Жёсткая фильтрация результатов: только "домовые" адреса
    function isHouseLevel(item) {
      // item.class / item.type часто: place/house, building, amenity и т.п.
      // но надежнее: наличие house_number в address
      const ad = item.address || item.addressdetails || {};
      const hasHouseNumber = !!ad.house_number;

      // дополнительно отсечём районы/округа: требуем наличие road и house_number
      const hasRoad = !!(ad.road || ad.pedestrian || ad.footway || ad.path);

      return hasHouseNumber && hasRoad;
    }

    // ---- Поиск подсказок (с 1-го символа)
    let debounceTimer = null;
    let lastQuery = "";

    async function searchSuggestions(raw) {
      const q = (raw || "").trim();

      // Подсказки с первого символа: но чтобы не ломать Nominatim, даём минимальную задержку и лимит
      // Если q = 1 символ, Nominatim может давать мусор. Мы всё равно показываем результаты,
      // но фильтрация "домовые + СПб/ЛО" обычно оставит немного или ноль.
      if (q.length === 0) return [];

      const url =
        `https://nominatim.openstreetmap.org/search?format=jsonv2` +
        `&q=${encodeURIComponent(q)}` +
        `&limit=10&addressdetails=1` +
        `&countrycodes=ru` +
        `&viewbox=${VIEWBOX.left},${VIEWBOX.top},${VIEWBOX.right},${VIEWBOX.bottom}` +
        `&bounded=1`;

      try {
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];
        const data = await res.json();

        // Фильтр:
        // 1) только СПб/ЛО
        // 2) только house-level (улица+дом)
        const filtered = (data || [])
          .filter(x => isInSpbOrLo(x.display_name))
          .filter(x => isHouseLevel(x));

        // Преобразуем в формат подсказки
        const mapped = filtered.map(x => {
          const details = x.address || x.addressdetails || {};
          const shortAddr = buildShortAddress(details);
          // если короткий адрес не удалось собрать — пропустим
          if (!shortAddr) return null;

          return {
            lat: parseFloat(x.lat),
            lon: parseFloat(x.lon),
            addressShort: shortAddr,
            addressFull: x.display_name
          };
        }).filter(Boolean);

        // Уберём дубли коротких адресов
        const seen = new Set();
        const unique = [];
        for (const it of mapped) {
          const key = `${it.addressShort}|${it.lat.toFixed(6)}|${it.lon.toFixed(6)}`;
          if (seen.has(key)) continue;
          seen.add(key);
          unique.push(it);
        }

        return unique.slice(0, 7);
      } catch (e) {
        return [];
      }
    }

    function renderResults(items) {
      if (!items || items.length === 0) {
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      items.forEach(it => {
        const div = document.createElement("div");
        div.className = "result";
        div.textContent = it.addressShort;

        div.onclick = () => {
          // ✅ При выборе подсказки: поле ввода заменяем на выбранный адрес
          addrInput.value = it.addressShort;

          selectedPlace = {
            lat: it.lat,
            lon: it.lon,
            addressShort: it.addressShort,
            addressFull: it.addressFull,
            map_link: `https://maps.google.com/?q=${it.lat},${it.lon}`
          };

          showWarn("");
          renderResults([]);
          setMarker(it.lat, it.lon);
          map.flyTo({ center: [it.lon, it.lat], zoom: 16 });

          updateUI();
        };

        resultsBox.appendChild(div);
      });
    }

    addrInput.addEventListener("input", () => {
      const q = addrInput.value || "";

      // Если пользователь после выбора подсказки начинает менять строку — сбрасываем выбор
      if (selectedPlace && q.trim() !== (selectedPlace.addressShort || "").trim()) {
        selectedPlace = null;
      }

      showWarn("");
      updateUI();

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const query = (addrInput.value || "").trim();
        lastQuery = query;

        const items = await searchSuggestions(query);
        if (lastQuery !== query) return; // гонка

        renderResults(items);

        // Если нет подсказок — запрет подтверждения
        if (items.length === 0 && query.length > 0) {
          selectedPlace = null;
          showWarn("Не найден подходящий адрес (улица+дом) в СПб/ЛО. Выберите адрес из подсказок.");
          updateUI();
        }
      }, 220); // быстрее реакция, ближе к “как в Яндекс”
    });

    addrInput.addEventListener("focus", () => {
      if (resultsBox.innerHTML.trim()) resultsBox.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      const isInside = resultsBox.contains(e.target) || addrInput.contains(e.target);
      if (!isInside) resultsBox.style.display = "none";
    });

    aptInput.addEventListener("input", () => updateUI());

    // Моё местоположение — оставим, но оно НЕ даёт подтвердить адрес,
    // пока пользователь не выберет адрес из подсказок (как ты просил).
    btnMyLoc.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Геолокация недоступна на этом устройстве.");
        return;
      }
      navigator.geolocation.getCurrentPosition((pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        map.flyTo({ center: [lon, lat], zoom: 16 });
        setMarker(lat, lon);
        selectedPlace = null;
        showWarn("Чтобы подтвердить — введите адрес и выберите его из подсказок (СПб/ЛО).");
        updateUI();
      }, () => {
        alert("Не удалось получить геопозицию. Проверьте разрешения.");
      }, { enableHighAccuracy: true, timeout: 8000 });
    });

    btnClear.addEventListener("click", () => {
      selectedPlace = null;
      if (marker) { marker.remove(); marker = null; }
      addrInput.value = "";
      aptInput.value = "";
      renderResults([]);
      showWarn("");
      showOk("");
      updateUI();
      statusBadge.textContent = "Введите адрес (СПб/ЛО)";
    });

    function sendToBot() {
      const apt = normalizeApartment(aptInput.value);

      if (!selectedPlace) {
        showWarn("Сначала выберите адрес из подсказок (улица+дом, СПб/ЛО).");
        updateUI();
        return;
      }
      if (!apt) {
        showWarn("Введите номер квартиры (обязательно).");
        updateUI();
        return;
      }

      const payload = {
        lat: selectedPlace.lat,
        lon: selectedPlace.lon,
        // В бот отправляем полный адрес, но без района/округа; можно сохранить addressFull, если нужно
        address: `${selectedPlace.addressShort}, кв. ${apt}`,
        apartment: apt,
        map_link: selectedPlace.map_link
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Откройте WebApp из Telegram. Данные:\n" + JSON.stringify(payload, null, 2));
      }
    }

    document.getElementById('btnConfirm').addEventListener('click', sendToBot);
    if (tg) tg.MainButton.onClick(sendToBot);

    updateUI();
  </script>
</body>
</html>
