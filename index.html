<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Yandex Maps JS API (нужен ключ) -->
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=d45b21dd-8e96-412f-8105-bb73a0d706af
"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: calc(100% - 64px); }
    .bar { height: 64px; display:flex; gap:8px; padding:10px; box-sizing:border-box; }
    input { flex:1; padding:10px; border:1px solid #ddd; border-radius:10px; }
    button { padding:10px 12px; border:0; border-radius:10px; }
  </style>
</head>
<body>
  <div class="bar">
    <input id="addr" placeholder="Адрес (улица, дом)" />
    <input id="apt" placeholder="Кв." style="max-width:90px;" />
    <button id="confirm">✅</button>
  </div>
  <div id="map"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let map, placemark;

    ymaps.ready(() => {
      map = new ymaps.Map("map", {
        center: [55.751244, 37.618423],
        zoom: 12
      });

      placemark = new ymaps.Placemark(map.getCenter(), {}, { draggable: true });
      map.geoObjects.add(placemark);

      map.events.add('click', async (e) => {
        const coords = e.get('coords');
        placemark.geometry.setCoordinates(coords);
      });
    });

    document.getElementById('confirm').addEventListener('click', async () => {
      const coords = placemark.geometry.getCoordinates();
      const address = (document.getElementById('addr').value || '').trim();
      const apt = (document.getElementById('apt').value || '').trim();

      const payload = {
        lat: coords[0],
        lon: coords[1],
        address: apt ? `${address}, кв. ${apt}` : address,
        apartment: apt,
        map_link: `https://yandex.ru/maps/?pt=${coords[1]},${coords[0]}&z=16&l=map`
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Откройте WebApp из Telegram.");
      }
    });
  </script>
</body>
</html>
