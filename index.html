<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса доставки</title>

  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Yandex Maps JS API 2.1 -->
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=d45b21dd-8e96-412f-8105-bb73a0d706af"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; }

    .panel {
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #eaeaea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; position: relative; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus { border-color: #2ea6ff; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      cursor: pointer;
      background: #f3f4f6;
      color: #111;
    }

    .btn-primary { background: #2ea6ff; color: #fff; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.35; }
    .addr { font-size: 14px; margin-top: 6px; color: #111; }
    .badge { font-size: 12px; background:#eef6ff; padding:4px 8px; border-radius:999px; }

    .warn { margin-top: 8px; font-size: 13px; color: #a14; }
    .ok { margin-top: 8px; font-size: 13px; color: #0a7; }

    /* Выпадающие подсказки */
    .results {
      position: absolute;
      top: 46px;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-height: 240px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    }
    .result {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.25;
    }
    .result:last-child { border-bottom: none; }
    .result:hover { background: #f8fafc; }
    .muted { color:#666; font-size: 12px; margin-top: 3px; }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <div class="row">
        <span class="badge" id="statusBadge">Введите адрес и выберите из подсказок (СПб/ЛО)</span>
        <button class="btn" id="btnMyLoc">📍 Моё местоположение</button>
        <button class="btn btn-primary" id="btnConfirm" disabled>✅ Подтвердить адрес</button>
      </div>

      <div class="col">
        <input id="addrInput" placeholder="Начните вводить: улица, дом, корпус/строение..." autocomplete="off" />
        <div class="results" id="results"></div>

        <div class="row" style="margin-top:6px;">
          <input id="aptInput" placeholder="Квартира (обязательно)" style="max-width: 240px;" inputmode="text" />
          <button class="btn" id="btnClear">✖ Сброс</button>
        </div>
      </div>

      <div class="addr" id="addrText"></div>
      <div class="warn" id="warn"></div>
      <div class="ok" id="ok"></div>

      <div class="hint">
        Подсказки даёт DaData (только СПб и Лен. область). Карта — Яндекс.
        Можно выбрать адрес по подсказкам или кликнуть по дому на карте — но подтвердить можно только для существующего дома + после ввода квартиры.
      </div>
    </div>
  </div>

  <script>
    /***********************
     * НАСТРОЙКИ
     ***********************/
    // 1) Вставь сюда токен DaData
    const DADATA_TOKEN = "PASTE_DADATA_TOKEN_HERE";

    // 2) Ограничение области (примерные границы СПб+ЛО)
    // В Яндекс: boundedBy = [[latSW, lonSW], [latNE, lonNE]]
    const BOUNDS_SPB_LO = [
      [58.3, 28.7],
      [61.3, 35.7]
    ];

    // 3) Минимум символов для запроса подсказок (в DaData можно с 1)
    const MIN_SUGGEST_LEN = 1;

    /***********************
     * UI
     ***********************/
    const tg = window.Telegram?.WebApp;

    const statusBadge = document.getElementById('statusBadge');
    const addrText = document.getElementById('addrText');
    const warn = document.getElementById('warn');
    const ok = document.getElementById('ok');

    const btnMyLoc = document.getElementById('btnMyLoc');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnClear = document.getElementById('btnClear');

    const addrInput = document.getElementById('addrInput');
    const aptInput = document.getElementById('aptInput');

    const resultsBox = document.getElementById('results');

    function showWarn(text) { warn.textContent = text || ""; }
    function showOk(text) { ok.textContent = text || ""; }

    if (tg) {
      tg.expand();
      tg.ready();
      tg.MainButton.setText("✅ Подтвердить адрес");
      tg.MainButton.hide();
    }

    function normalizeApartment(value) {
      const v = (value || "").trim();
      if (!v) return "";
      if (!/\d/.test(v)) return ""; // хотя бы одна цифра
      return v;
    }

    function isWithinBounds(lat, lon) {
      const sw = BOUNDS_SPB_LO[0];
      const ne = BOUNDS_SPB_LO[1];
      return lat >= sw[0] && lat <= ne[0] && lon >= sw[1] && lon <= ne[1];
    }

    function clearResults() {
      resultsBox.style.display = "none";
      resultsBox.innerHTML = "";
    }

    function updateUI() {
      const apt = normalizeApartment(aptInput.value);
      const hasSelection = !!selectedPlace;

      if (!hasSelection) {
        statusBadge.textContent = "Введите адрес и выберите из подсказок (СПб/ЛО)";
        addrText.textContent = "";
        btnConfirm.disabled = true;
        showOk("");
        if (tg) tg.MainButton.hide();
        return;
      }

      statusBadge.textContent = "Адрес выбран ✅ (введите квартиру)";
      addrText.textContent = "Адрес: " + selectedPlace.addressShort;

      const canConfirm = !!apt;
      btnConfirm.disabled = !canConfirm;

      if (tg) {
        if (canConfirm) tg.MainButton.show();
        else tg.MainButton.hide();
      }

      if (canConfirm) showOk("Можно подтвердить адрес ✅");
      else showOk("");
    }

    function resetSelection(msg) {
      selectedPlace = null;
      showOk("");
      if (msg) showWarn(msg);
      updateUI();
    }

    /***********************
     * YANDEX MAP
     ***********************/
    let map, placemark;

    function setPlacemark(lat, lon) {
      if (!placemark) {
        placemark = new ymaps.Placemark([lat, lon], {}, { draggable: false });
        map.geoObjects.add(placemark);
      } else {
        placemark.geometry.setCoordinates([lat, lon]);
      }
    }

    // По клику на карте — обратный геокодинг "house"
    async function reverseGeocodeHouse(lat, lon) {
      try {
        const res = await ymaps.geocode([lat, lon], { results: 5, kind: 'house' });
        const geoObject = res.geoObjects.get(0);
        if (!geoObject) return null;

        const coords = geoObject.geometry.getCoordinates();
        const rLat = coords[0], rLon = coords[1];
        if (!isWithinBounds(rLat, rLon)) return null;

        const md = geoObject.properties.get('metaDataProperty.GeocoderMetaData');
        const precision = md && md.precision ? md.precision : "";
        if (precision && !(precision === "exact" || precision === "number")) return null;

        const fullAddr = geoObject.getAddressLine() || "";
        // На всякий случай: из Яндекса берём строку, но в поле ввода ставим "короткую" из DaData-стиля невозможно.
        // Тут оставим полную, а при отправке — всё равно валидный дом.
        return { lat: rLat, lon: rLon, addressShort: fullAddr, addressFull: fullAddr };
      } catch {
        return null;
      }
    }

    /***********************
     * DADATA SUGGEST
     ***********************/
    // selectedPlace — только подтвержденный дом с координатами
    // { lat, lon, addressShort, addressFull, map_link, source }
    let selectedPlace = null;

    function buildShortFromDaData(d) {
      // d = suggestion.data
      const street = (d.street_with_type || d.street || "").trim();
      const house = (d.house || "").trim();

      // корпус/строение
      // d.block — корпус, d.building — строение (часто)
      let extra = "";
      if (d.block) extra = `к${d.block}`;
      else if (d.building) extra = `стр${d.building}`;

      let out = "";
      if (street && house) out = `${street}, ${house}${extra ? " " + extra : ""}`;
      else if (d.result) out = d.result;
      else out = "";

      return out.trim();
    }

    function isSpbOrLo(d) {
      // Строгая фильтрация только СПб и Ленобласть
      // DaData: region_with_type, city_with_type
      const city = (d.city_with_type || "").toLowerCase();
      const region = (d.region_with_type || "").toLowerCase();

      const isSpb = city.includes("санкт-петербург") || city.includes("санкт петербург");
      const isLo = region.includes("ленинградская") || region.includes("ленинградская область");

      // В Ленобласти city может быть не "Санкт-Петербург" — поэтому считаем Lo по региону
      return isSpb || isLo;
    }

    function isHouseLevelDaData(d) {
      // Требуем улицу+дом и координаты
      const hasStreet = !!(d.street_with_type || d.street);
      const hasHouse = !!d.house;
      const hasCoords = !!d.geo_lat && !!d.geo_lon;
      return hasStreet && hasHouse && hasCoords;
    }

    async function dadataSuggest(query) {
      const q = (query || "").trim();
      if (!q || q.length < MIN_SUGGEST_LEN) return [];

      if (!DADATA_TOKEN || DADATA_TOKEN === "PASTE_DADATA_TOKEN_HERE") {
        // Чтобы не ломалось молча
        showWarn("Нужно вставить DaData токен в index.html (DADATA_TOKEN).");
        return [];
      }

      // DaData Suggest Address
      const url = "https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address";

      // Ограничение только СПб и Ленинградская область
      const body = {
        query: q,
        count: 7,
        // Принудительно ограничиваем регион
        locations: [
          { city: "Санкт-Петербург" },
          { region: "Ленинградская" }
        ],
        restrict_value: true,
        // Хотим именно домовые адреса
        from_bound: { value: "street" },
        to_bound:   { value: "house" }
      };

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json",
            "Authorization": "Token " + DADATA_TOKEN
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) return [];
        const json = await res.json();
        return (json && json.suggestions) ? json.suggestions : [];
      } catch {
        return [];
      }
    }

    function renderSuggestions(suggestions) {
      if (!suggestions || suggestions.length === 0) {
        clearResults();
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      suggestions.forEach((sug) => {
        const d = sug.data || {};
        const shortAddr = buildShortFromDaData(d);
        const full = sug.value || shortAddr || "";

        const div = document.createElement("div");
        div.className = "result";
        div.textContent = shortAddr || full;

        const meta = document.createElement("div");
        meta.className = "muted";
        meta.textContent = (d.city_with_type || d.settlement_with_type || d.region_with_type || "").trim();
        if (meta.textContent) div.appendChild(meta);

        div.onclick = () => {
          clearResults();
          showWarn("");

          // Фильтрация перед выбором
          if (!isSpbOrLo(d)) {
            resetSelection("Можно выбрать адрес только в Санкт-Петербурге или Ленинградской области.");
            return;
          }
          if (!isHouseLevelDaData(d)) {
            resetSelection("Нужен адрес уровня «улица + дом» (существующий дом).");
            return;
          }

          const lat = parseFloat(d.geo_lat);
          const lon = parseFloat(d.geo_lon);

          if (!isWithinBounds(lat, lon)) {
            resetSelection("Адрес вне зоны доставки (СПб/ЛО).");
            return;
          }

          const shortAddress = buildShortFromDaData(d) || full;

          // ✅ В поле ввода ставим выбранный адрес
          addrInput.value = shortAddress;

          selectedPlace = {
            lat, lon,
            addressShort: shortAddress,
            addressFull: full,
            map_link: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16&l=map`,
            source: "dadata"
          };

          setPlacemark(lat, lon);
          map.setCenter([lat, lon], 16, { duration: 250 });

          updateUI();
        };

        resultsBox.appendChild(div);
      });
    }

    // Debounce + защита от гонок
    let debounceTimer = null;
    let lastQuery = "";

    addrInput.addEventListener("input", () => {
      const q = (addrInput.value || "").trim();

      // Если пользователь начал менять поле после выбора — сброс
      if (selectedPlace && q !== (selectedPlace.addressShort || "").trim()) {
        selectedPlace = null;
      }
      updateUI();

      if (!q) {
        clearResults();
        showWarn("");
        return;
      }

      // Лёгкая подсказка на первые символы
      if (q.length < 3) {
        showWarn("Введите ещё пару символов — появятся подсказки домов в СПб/ЛО.");
      } else {
        showWarn("");
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const now = (addrInput.value || "").trim();
        lastQuery = now;

        const suggestions = await dadataSuggest(now);
        if (lastQuery !== now) return;

        // Отфильтруем на всякий случай
        const filtered = (suggestions || []).filter(s => {
          const d = s.data || {};
          return isSpbOrLo(d) && isHouseLevelDaData(d);
        });

        renderSuggestions(filtered);

        if ((filtered || []).length === 0 && now.length >= 3) {
          resetSelection("Подсказок нет. Уточните адрес (улица и номер дома) и выберите из подсказок.");
        }
      }, 180);
    });

    addrInput.addEventListener("focus", () => {
      if (resultsBox.innerHTML.trim()) resultsBox.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      const isInside = resultsBox.contains(e.target) || addrInput.contains(e.target);
      if (!isInside) clearResults();
    });

    aptInput.addEventListener("input", () => updateUI());

    /***********************
     * SEND TO BOT
     ***********************/
    function sendToBot() {
      const apt = normalizeApartment(aptInput.value);

      if (!selectedPlace) {
        showWarn("Сначала выберите адрес из подсказок (DaData) или кликните по дому на карте.");
        updateUI();
        return;
      }
      if (!apt) {
        showWarn("Введите номер квартиры (обязательно).");
        updateUI();
        return;
      }

      const payload = {
        lat: selectedPlace.lat,
        lon: selectedPlace.lon,
        address: `${selectedPlace.addressShort}, кв. ${apt}`,
        apartment: apt,
        map_link: selectedPlace.map_link
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert(JSON.stringify(payload, null, 2));
      }
    }

    btnConfirm.addEventListener("click", sendToBot);
    if (tg) tg.MainButton.onClick(sendToBot);

    /***********************
     * INIT MAP
     ***********************/
    ymaps.ready(() => {
      map = new ymaps.Map("map", {
        center: [59.9386, 30.3141],
        zoom: 11,
        controls: ['zoomControl']
      });

      map.setBounds(BOUNDS_SPB_LO, { checkZoomRange: true });

      // Клик по карте: выбираем дом (если дом не найден — не подтверждаем)
      map.events.add('click', async (e) => {
        const coords = e.get('coords'); // [lat, lon]
        const lat = coords[0], lon = coords[1];

        setPlacemark(lat, lon);
        showWarn("Проверяем выбранную точку…");

        const geo = await reverseGeocodeHouse(lat, lon);
        if (!geo) {
          resetSelection("По этой точке не найден существующий дом (house) в СПб/ЛО. Кликните точнее по зданию или используйте подсказки.");
          return;
        }

        addrInput.value = geo.addressShort;

        selectedPlace = {
          lat: geo.lat,
          lon: geo.lon,
          addressShort: geo.addressShort,
          addressFull: geo.addressFull,
          map_link: `https://yandex.ru/maps/?pt=${geo.lon},${geo.lat}&z=16&l=map`,
          source: "yandex_reverse"
        };

        showWarn("");
        updateUI();
      });

      btnMyLoc.addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert("Геолокация недоступна.");
          return;
        }
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          setPlacemark(lat, lon);
          map.setCenter([lat, lon], 16);

          showWarn("Проверяем текущую точку…");

          const geo = await reverseGeocodeHouse(lat, lon);
          if (!geo) {
            resetSelection("По вашей точке не найден существующий дом (house) в СПб/ЛО. Введите адрес и выберите из подсказок.");
            return;
          }

          addrInput.value = geo.addressShort;

          selectedPlace = {
            lat: geo.lat,
            lon: geo.lon,
            addressShort: geo.addressShort,
            addressFull: geo.addressFull,
            map_link: `https://yandex.ru/maps/?pt=${geo.lon},${geo.lat}&z=16&l=map`,
            source: "yandex_geoloc"
          };

          showWarn("");
          updateUI();
        }, () => alert("Не удалось получить геопозицию."), { enableHighAccuracy: true, timeout: 8000 });
      });

      btnClear.addEventListener('click', () => {
        selectedPlace = null;
        addrInput.value = "";
        aptInput.value = "";
        clearResults();
        if (placemark) {
          map.geoObjects.remove(placemark);
          placemark = null;
        }
        map.setCenter([59.9386, 30.3141], 11);
        showWarn("");
        showOk("");
        updateUI();
      });

      updateUI();
    });
  </script>
</body>
</html>
