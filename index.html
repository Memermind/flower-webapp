<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса доставки</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=d45b21dd-8e96-412f-8105-bb73a0d706af"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; }

    .panel {
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #eaeaea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; position: relative; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus { border-color: #2ea6ff; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      cursor: pointer;
      background: #f3f4f6;
      color: #111;
    }

    .btn-primary { background: #2ea6ff; color: #fff; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.35; }
    .addr { font-size: 14px; margin-top: 6px; color: #111; }
    .badge { font-size: 12px; background:#eef6ff; padding:4px 8px; border-radius:999px; }

    .warn { margin-top: 8px; font-size: 13px; color: #a14; }
    .ok { margin-top: 8px; font-size: 13px; color: #0a7; }

    .results {
      position: absolute;
      top: 46px;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-height: 260px;
      overflow-y: auto;
      display: none;
      z-index: 9999;
    }
    .result {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.25;
    }
    .result:last-child { border-bottom: none; }
    .result:hover { background: #f8fafc; }
    .muted { color:#666; font-size: 12px; margin-top: 3px; }

    .stage {
      font-size: 12px;
      background:#f4f4f5;
      padding:4px 8px;
      border-radius:999px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <div class="row">
        <span class="badge" id="statusBadge">Введите улицу (СПб/ЛО) и выберите из подсказок</span>
        <span class="stage" id="stageChip">Шаг: улица</span>
        <button class="btn" id="btnMyLoc">📍 Моё местоположение</button>
        <button class="btn btn-primary" id="btnConfirm" disabled>✅ Подтвердить адрес</button>
      </div>

      <div class="col">
        <input id="addrInput" placeholder="Начните вводить улицу..." autocomplete="off" />
        <div class="results" id="results"></div>

        <div class="row" style="margin-top:6px;">
          <input id="aptInput" placeholder="Квартира (обязательно)" style="max-width: 240px;" inputmode="text" />
          <button class="btn" id="btnClear">✖ Сброс</button>
        </div>
      </div>

      <div class="addr" id="addrText"></div>
      <div class="warn" id="warn"></div>
      <div class="ok" id="ok"></div>

      <div class="hint">
        Сначала выберите улицу из подсказок (DaData), затем выберите дом на этой улице.
        Подтвердить можно только после выбора дома + ввода квартиры. Поиск ограничен СПб и Ленинградской областью.
      </div>
    </div>
  </div>

  <script>
    // === Настройки ===
    const DADATA_TOKEN = "13f8a74e3a5f41332160cb95285e03866c18f152"; // <- оставь свой
    const MIN_SUGGEST_LEN = 1;

    // === Ограничение СПб+ЛО (для карты / обратного геокодинга) ===
    const BOUNDS_SPB_LO = [
      [58.3, 28.7],
      [61.3, 35.7]
    ];

    const tg = window.Telegram?.WebApp;

    const statusBadge = document.getElementById('statusBadge');
    const stageChip = document.getElementById('stageChip');
    const addrText = document.getElementById('addrText');
    const warn = document.getElementById('warn');
    const ok = document.getElementById('ok');

    const btnMyLoc = document.getElementById('btnMyLoc');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnClear = document.getElementById('btnClear');

    const addrInput = document.getElementById('addrInput');
    const aptInput = document.getElementById('aptInput');
    const resultsBox = document.getElementById('results');

    function showWarn(text) { warn.textContent = text || ""; }
    function showOk(text) { ok.textContent = text || ""; }

    if (tg) {
      tg.expand();
      tg.ready();
      tg.MainButton.setText("✅ Подтвердить адрес");
      tg.MainButton.hide();
    }

    function normalizeApartment(value) {
      const v = (value || "").trim();
      if (!v) return "";
      if (!/\d/.test(v)) return "";
      return v;
    }

    function isWithinBounds(lat, lon) {
      const sw = BOUNDS_SPB_LO[0];
      const ne = BOUNDS_SPB_LO[1];
      return lat >= sw[0] && lat <= ne[0] && lon >= sw[1] && lon <= ne[1];
    }

    function clearResults() {
      resultsBox.style.display = "none";
      resultsBox.innerHTML = "";
    }

    // === Состояние выбора ===
    // stage: "street" | "house"
    let stage = "street";

    // выбранная улица (из DaData)
    let selectedStreet = null; // { street_with_type, city, region }

    // выбранный дом (подтвержденный)
    let selectedPlace = null; // { lat, lon, addressShort, addressFull, map_link, source }

    function setStage(newStage) {
      stage = newStage;

      if (stage === "street") {
        stageChip.textContent = "Шаг: улица";
        statusBadge.textContent = "Введите улицу (СПб/ЛО) и выберите из подсказок";
        addrInput.placeholder = "Начните вводить улицу...";
      } else {
        stageChip.textContent = "Шаг: дом";
        statusBadge.textContent = "Теперь выберите дом на выбранной улице";
        addrInput.placeholder = "Введите номер дома (или дом+корпус)…";
      }

      clearResults();
      updateUI();
    }

    function updateUI() {
      const apt = normalizeApartment(aptInput.value);
      const hasHouse = !!selectedPlace;

      if (!hasHouse) {
        btnConfirm.disabled = true;
        showOk("");
        if (tg) tg.MainButton.hide();

        if (stage === "street" && !selectedStreet) {
          addrText.textContent = "";
        }
        if (stage === "house" && selectedStreet) {
          addrText.textContent = "Улица: " + (selectedStreet.street_with_type || "");
        }
        return;
      }

      addrText.textContent = "Адрес: " + selectedPlace.addressShort;

      const canConfirm = !!apt;
      btnConfirm.disabled = !canConfirm;

      if (tg) {
        if (canConfirm) tg.MainButton.show();
        else tg.MainButton.hide();
      }

      if (canConfirm) showOk("Можно подтвердить адрес ✅");
      else showOk("");
    }

    function resetAll(msg) {
      selectedStreet = null;
      selectedPlace = null;
      setStage("street");
      addrInput.value = "";
      aptInput.value = "";
      if (placemark) {
        map.geoObjects.remove(placemark);
        placemark = null;
      }
      map.setCenter([59.9386, 30.3141], 11);
      showOk("");
      showWarn(msg || "");
      updateUI();
    }

    function resetHouse(msg) {
      selectedPlace = null;
      showOk("");
      showWarn(msg || "");
      updateUI();
    }

    // === Формат адреса “улица, дом, корпус/строение” ===
    function shortHouseFromDaData(d) {
      const street = (d.street_with_type || "").trim();
      const house = (d.house || "").trim();

      let extra = "";
      if (d.block) extra = `к${d.block}`;
      else if (d.building) extra = `стр${d.building}`;

      if (street && house) return `${street}, ${house}${extra ? " " + extra : ""}`.trim();
      return "";
    }

    // === Фильтр СПб/ЛО ===
    function isSpbOrLo(d) {
      const city = (d.city_with_type || "").toLowerCase();
      const region = (d.region_with_type || "").toLowerCase();

      const isSpb = city.includes("санкт-петербург") || city.includes("санкт петербург");
      const isLo = region.includes("ленинградская") || region.includes("ленинградская область");

      return isSpb || isLo;
    }

    function isStreetLevel(d) {
      // улица должна быть
      return !!(d.street_with_type || d.street);
    }

    function isHouseLevel(d) {
      return !!(d.street_with_type) && !!d.house && !!d.geo_lat && !!d.geo_lon;
    }

    // === DaData запрос ===
    async function dadataSuggest(query) {
      const q = (query || "").trim();
      if (!q || q.length < MIN_SUGGEST_LEN) return [];

      if (!DADATA_TOKEN || DADATA_TOKEN === "PASTE_DADATA_TOKEN_HERE") {
        showWarn("Нужно вставить DaData токен в index.html (DADATA_TOKEN).");
        return [];
      }

      const url = "https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address";

      let body;

      if (stage === "street") {
        // Этап 1: отдаём улицы (без домов), много вариантов, сразу с 1 символа
        body = {
          query: q,
          count: 10,
          locations: [
            { city: "Санкт-Петербург" },
            { region: "Ленинградская" }
          ],
          restrict_value: true,
          from_bound: { value: "city" },
          to_bound:   { value: "street" }
        };
      } else {
        // Этап 2: улица уже выбрана — ищем дома на ней
        // Трюк: добавляем выбранную улицу в query, чтобы DaData точнее подбирал дома
        const streetQ = (selectedStreet?.street_with_type || "").trim();
        const fullQuery = streetQ ? `${streetQ}, ${q}` : q;

        body = {
          query: fullQuery,
          count: 10,
          locations: [
            { city: "Санкт-Петербург" },
            { region: "Ленинградская" }
          ],
          restrict_value: true,
          from_bound: { value: "street" },
          to_bound:   { value: "house" }
        };
      }

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json",
            "Authorization": "Token " + DADATA_TOKEN
          },
          body: JSON.stringify(body)
        });

        if (!res.ok) return [];
        const json = await res.json();
        return (json && json.suggestions) ? json.suggestions : [];
      } catch {
        return [];
      }
    }

    // === Рендер подсказок ===
    function renderSuggestions(suggestions) {
      if (!suggestions || suggestions.length === 0) {
        clearResults();
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      suggestions.slice(0, 10).forEach((sug) => {
        const d = sug.data || {};

        let title = "";
        let subtitle = "";

        if (stage === "street") {
          title = (d.street_with_type || sug.value || "").trim();
          subtitle = ((d.city_with_type || "") + (d.region_with_type ? ", " + d.region_with_type : "")).trim();
        } else {
          title = shortHouseFromDaData(d) || (sug.value || "").trim();
          subtitle = (d.city_with_type || d.region_with_type || "").trim();
        }

        const div = document.createElement("div");
        div.className = "result";
        div.textContent = title;

        if (subtitle) {
          const meta = document.createElement("div");
          meta.className = "muted";
          meta.textContent = subtitle;
          div.appendChild(meta);
        }

        div.onclick = () => {
          clearResults();
          showWarn("");

          if (!isSpbOrLo(d)) {
            showWarn("Можно выбрать адрес только в Санкт-Петербурге или Ленинградской области.");
            return;
          }

          if (stage === "street") {
            if (!isStreetLevel(d)) {
              showWarn("Выберите улицу из подсказок.");
              return;
            }

            // Сохраняем улицу и переходим на этап домов
            selectedStreet = {
              street_with_type: (d.street_with_type || sug.value || "").trim(),
              city: (d.city_with_type || "").trim(),
              region: (d.region_with_type || "").trim()
            };

            // В поле ввода показываем улицу и переходим к домам
            addrInput.value = "";
            selectedPlace = null;

            setStage("house");
            showWarn("Теперь введите номер дома и выберите дом из подсказок.");
            updateUI();
            return;
          }

          // stage === "house"
          if (!isHouseLevel(d)) {
            showWarn("Нужен существующий адрес уровня «улица + дом». Выберите дом из подсказок.");
            return;
          }

          const lat = parseFloat(d.geo_lat);
          const lon = parseFloat(d.geo_lon);
          if (!isWithinBounds(lat, lon)) {
            resetHouse("Адрес вне зоны доставки (СПб/ЛО).");
            return;
          }

          const shortAddr = shortHouseFromDaData(d);
          if (!shortAddr) {
            resetHouse("Не удалось собрать формат «улица, дом». Выберите другой адрес.");
            return;
          }

          // В поле ввода можно оставить “дом” или “улица, дом” — для UX лучше “улица, дом”
          addrInput.value = shortAddr;

          selectedPlace = {
            lat, lon,
            addressShort: shortAddr,
            addressFull: sug.value || shortAddr,
            map_link: `https://yandex.ru/maps/?pt=${lon},${lat}&z=16&l=map`,
            source: "dadata"
          };

          setPlacemark(lat, lon);
          map.setCenter([lat, lon], 16, { duration: 250 });

          updateUI();
        };

        resultsBox.appendChild(div);
      });
    }

    // === Debounce ввода ===
    let debounceTimer = null;
    let lastQuery = "";

    addrInput.addEventListener("input", () => {
      const q = (addrInput.value || "").trim();

      // если на этапе house пользователь стер — просто продолжим, но дом надо выбрать заново
      if (stage === "house") {
        selectedPlace = null;
      } else {
        // stage street — сброс улицы если начали печатать с нуля (не обязателен)
        selectedStreet = null;
        selectedPlace = null;
      }

      updateUI();

      if (!q) {
        clearResults();
        showWarn("");
        return;
      }

      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        const now = (addrInput.value || "").trim();
        lastQuery = now;

        const suggestions = await dadataSuggest(now);
        if (lastQuery !== now) return;

        // Фильтры под этап
        let filtered = suggestions || [];
        filtered = filtered.filter(s => isSpbOrLo(s.data || {}));

        if (stage === "street") {
          filtered = filtered.filter(s => isStreetLevel(s.data || {}));
        } else {
          filtered = filtered.filter(s => isHouseLevel(s.data || {}));
        }

        renderSuggestions(filtered);

        if ((filtered || []).length === 0 && now.length >= 2) {
          if (stage === "street") {
            showWarn("Подсказок улиц нет. Уточните название (СПб/ЛО).");
          } else {
            showWarn("Подсказок домов нет. Введите номер дома и выберите дом из подсказок.");
          }
        }
      }, 160);
    });

    addrInput.addEventListener("focus", () => {
      if (resultsBox.innerHTML.trim()) resultsBox.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      const isInside = resultsBox.contains(e.target) || addrInput.contains(e.target);
      if (!isInside) clearResults();
    });

    aptInput.addEventListener("input", () => updateUI());

    // === Yandex map init + клики ===
    let map, placemark;

    function setPlacemark(lat, lon) {
      if (!placemark) {
        placemark = new ymaps.Placemark([lat, lon], {}, { draggable: false });
        map.geoObjects.add(placemark);
      } else {
        placemark.geometry.setCoordinates([lat, lon]);
      }
    }

    async function reverseGeocodeHouse(lat, lon) {
      try {
        const res = await ymaps.geocode([lat, lon], { results: 5, kind: 'house' });
        const geoObject = res.geoObjects.get(0);
        if (!geoObject) return null;

        const coords = geoObject.geometry.getCoordinates();
        const rLat = coords[0], rLon = coords[1];

        if (!isWithinBounds(rLat, rLon)) return null;

        const md = geoObject.properties.get('metaDataProperty.GeocoderMetaData');
        const precision = md && md.precision ? md.precision : "";
        if (precision && !(precision === "exact" || precision === "number")) return null;

        const fullAddr = geoObject.getAddressLine() || "";
        return { lat: rLat, lon: rLon, addressShort: fullAddr, addressFull: fullAddr };
      } catch {
        return null;
      }
    }

    // === Отправка в бот ===
    function sendToBot() {
      const apt = normalizeApartment(aptInput.value);

      if (!selectedPlace) {
        showWarn("Сначала выберите дом из подсказок (улица + дом).");
        return;
      }
      if (!apt) {
        showWarn("Введите номер квартиры (обязательно).");
        return;
      }

      const payload = {
        lat: selectedPlace.lat,
        lon: selectedPlace.lon,
        address: `${selectedPlace.addressShort}, кв. ${apt}`,
        apartment: apt,
        map_link: selectedPlace.map_link
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert(JSON.stringify(payload, null, 2));
      }
    }

    btnConfirm.addEventListener("click", sendToBot);
    if (tg) tg.MainButton.onClick(sendToBot);

    btnClear.addEventListener("click", () => resetAll(""));

    ymaps.ready(() => {
      map = new ymaps.Map("map", {
        center: [59.9386, 30.3141],
        zoom: 11,
        controls: ['zoomControl']
      });

      map.setBounds(BOUNDS_SPB_LO, { checkZoomRange: true });

      // Клик по карте выбирает дом сразу (это альтернативный путь)
      map.events.add('click', async (e) => {
        const coords = e.get('coords');
        const lat = coords[0], lon = coords[1];

        setPlacemark(lat, lon);
        showWarn("Проверяем выбранную точку…");

        const geo = await reverseGeocodeHouse(lat, lon);
        if (!geo) {
          resetHouse("По этой точке не найден существующий дом (house) в СПб/ЛО. Кликните точнее по зданию.");
          return;
        }

        // При клике по карте мы считаем, что дом выбран (и не требуем улицу через DaData)
        selectedStreet = null;
        setStage("house");

        addrInput.value = geo.addressShort;

        selectedPlace = {
          lat: geo.lat,
          lon: geo.lon,
          addressShort: geo.addressShort,
          addressFull: geo.addressFull,
          map_link: `https://yandex.ru/maps/?pt=${geo.lon},${geo.lat}&z=16&l=map`,
          source: "yandex_reverse"
        };

        showWarn("");
        updateUI();
      });

      btnMyLoc.addEventListener('click', () => {
        if (!navigator.geolocation) {
          alert("Геолокация недоступна.");
          return;
        }
        navigator.geolocation.getCurrentPosition(async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          setPlacemark(lat, lon);
          map.setCenter([lat, lon], 16);

          showWarn("Проверяем текущую точку…");

          const geo = await reverseGeocodeHouse(lat, lon);
          if (!geo) {
            resetHouse("По вашей точке не найден существующий дом (house) в СПб/ЛО. Выберите адрес через подсказки.");
            return;
          }

          selectedStreet = null;
          setStage("house");

          addrInput.value = geo.addressShort;

          selectedPlace = {
            lat: geo.lat,
            lon: geo.lon,
            addressShort: geo.addressShort,
            addressFull: geo.addressFull,
            map_link: `https://yandex.ru/maps/?pt=${geo.lon},${geo.lat}&z=16&l=map`,
            source: "yandex_geoloc"
          };

          showWarn("");
          updateUI();
        }, () => alert("Не удалось получить геопозицию."), { enableHighAccuracy: true, timeout: 8000 });
      });

      setStage("street");
      updateUI();
    });
  </script>
</body>
</html>
