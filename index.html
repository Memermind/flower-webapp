<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор адреса доставки</title>

  <!-- Telegram WebApp API -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- MapLibre GL JS (без Leaflet) -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; }

    .panel {
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border-top: 1px solid #eaeaea;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #2ea6ff; }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 15px;
      cursor: pointer;
      background: #f3f4f6;
      color: #111;
    }

    .btn-primary { background: #2ea6ff; color: #fff; }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .hint { font-size: 13px; color: #555; margin-top: 6px; line-height: 1.35; }
    .addr { font-size: 14px; margin-top: 6px; color: #111; }
    .badge { font-size: 12px; background:#eef6ff; padding:4px 8px; border-radius:999px; }

    .results {
      margin-top: 8px;
      border: 1px solid #eee;
      border-radius: 10px;
      overflow: hidden;
      max-height: 210px;
      overflow-y: auto;
      display: none;
      background: #fff;
    }

    .result {
      padding: 10px 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.25;
    }
    .result:last-child { border-bottom: none; }
    .result:hover { background: #f8fafc; }

    .warn {
      margin-top: 8px;
      font-size: 13px;
      color: #a14;
    }

    .ok {
      margin-top: 8px;
      font-size: 13px;
      color: #0a7;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>

    <div class="panel">
      <div class="row">
        <span class="badge" id="statusBadge">Введите адрес и выберите из подсказок</span>
        <button class="btn" id="btnMyLoc">📍 Моё местоположение</button>
        <button class="btn btn-primary" id="btnConfirm" disabled>✅ Подтвердить адрес</button>
      </div>

      <div class="col">
        <input id="addrInput" placeholder="Начните вводить адрес (только СПб и Лен. область)..." autocomplete="off" />
        <div class="row">
          <input id="aptInput" placeholder="Квартира (обязательно)" style="max-width: 240px;" inputmode="numeric" />
          <button class="btn" id="btnClear">✖ Сброс</button>
        </div>
      </div>

      <div class="results" id="results"></div>

      <div class="addr" id="addrText"></div>
      <div class="warn" id="warn"></div>
      <div class="ok" id="ok"></div>

      <div class="hint">
        Важно: адрес можно подтвердить только после выбора из подсказок и ввода квартиры.
        Поиск ограничен Санкт-Петербургом и Ленинградской областью.
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const warn = document.getElementById('warn');
    const ok = document.getElementById('ok');

    function showWarn(text) { warn.textContent = text || ""; }
    function showOk(text) { ok.textContent = text || ""; }

    if (tg) {
      tg.expand();
      tg.ready();
      tg.MainButton.setText("✅ Подтвердить адрес");
      tg.MainButton.hide();
    } else {
      showWarn("WebApp открыт не внутри Telegram. Откройте карту через кнопку в боте.");
    }

    // --- Map style (raster tiles OSM)
    const style = {
      "version": 8,
      "sources": {
        "raster-tiles": {
          "type": "raster",
          "tiles": [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          "tileSize": 256,
          "attribution": "© OpenStreetMap contributors"
        }
      },
      "layers": [
        { "id": "osm", "type": "raster", "source": "raster-tiles" }
      ]
    };

    // Центр СПб
    const map = new maplibregl.Map({
      container: "map",
      style,
      center: [30.3141, 59.9386], // lon, lat
      zoom: 11
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

    // --- Ограничение региона: СПб + Лен. область (примерные границы)
    // viewbox: left,top,right,bottom (lon_left,lat_top,lon_right,lat_bottom)
    // Это грубая “рамка” для поиска. Далее мы дополнительно фильтруем текстом по региону.
    const VIEWBOX = {
      left: 28.7,
      top: 61.3,
      right: 35.7,
      bottom: 58.3
    };

    // --- State
    let marker = null;

    // selectedPlace означает: пользователь выбрал именно подсказку (а не просто набрал текст)
    let selectedPlace = null; // {lat, lon, address, map_link}

    const statusBadge = document.getElementById('statusBadge');
    const addrText = document.getElementById('addrText');
    const btnConfirm = document.getElementById('btnConfirm');
    const btnMyLoc = document.getElementById('btnMyLoc');
    const btnClear = document.getElementById('btnClear');
    const addrInput = document.getElementById('addrInput');
    const aptInput = document.getElementById('aptInput');
    const resultsBox = document.getElementById('results');

    function isInSpbOrLo(displayName) {
      const s = (displayName || "").toLowerCase();

      // Признаки СПб
      const isSpb =
        s.includes("санкт-петербург") ||
        s.includes("санкт петербург") ||
        s.includes("sankt-peterburg") ||
        s.includes("saint petersburg");

      // Признаки Лен. области
      const isLo =
        s.includes("ленинградская область") ||
        s.includes("ленинградская обл") ||
        s.includes("leningrad oblast") ||
        s.includes("leningradskaya oblast");

      return isSpb || isLo;
    }

    function normalizeApartment(value) {
      const v = (value || "").trim();
      // квартира обязательна и должна содержать хотя бы одну цифру
      if (!v) return "";
      // можно вводить 12, 12а, 12/1 — оставим как есть, но проверим, что есть цифра
      if (!/\d/.test(v)) return "";
      return v;
    }

    function updateUI() {
      const apt = normalizeApartment(aptInput.value);

      // Если пользователь печатает адрес после выбора — сбрасываем выбор
      const hasSelection = !!selectedPlace;

      if (!hasSelection) {
        statusBadge.textContent = "Введите адрес и выберите из подсказок";
        addrText.textContent = "";
        btnConfirm.disabled = true;
        if (tg) tg.MainButton.hide();
        showOk("");
        return;
      }

      // Есть выбранный адрес
      statusBadge.textContent = "Адрес выбран ✅ (введите квартиру)";
      addrText.textContent = "Адрес: " + selectedPlace.address;

      // Подтверждение только если квартира введена
      const canConfirm = !!apt;
      btnConfirm.disabled = !canConfirm;

      if (tg) {
        if (canConfirm) {
          tg.MainButton.show();
        } else {
          tg.MainButton.hide();
        }
      }

      if (canConfirm) {
        showOk("Можно подтвердить адрес ✅");
      } else {
        showOk("");
      }
    }

    function setMarker(lat, lon) {
      if (!marker) {
        marker = new maplibregl.Marker({ draggable: true })
          .setLngLat([lon, lat])
          .addTo(map);

        marker.on('dragend', async () => {
          // При ручном перетаскивании: перепроверяем адрес и регион.
          const p = marker.getLngLat();
          const reverse = await reverseGeocode(p.lat, p.lng);

          if (!reverse || !reverse.display_name || !isInSpbOrLo(reverse.display_name)) {
            selectedPlace = null;
            showWarn("Точку можно выбрать только в Санкт-Петербурге или Ленинградской области. Выберите адрес из подсказок.");
            updateUI();
            return;
          }

          selectedPlace = {
            lat: p.lat,
            lon: p.lng,
            address: reverse.display_name,
            map_link: `https://maps.google.com/?q=${p.lat},${p.lng}`,
          };
          addrInput.value = reverse.display_name;
          showWarn("");
          resultsBox.style.display = "none";
          resultsBox.innerHTML = "";
          updateUI();
        });
      } else {
        marker.setLngLat([lon, lat]);
      }
    }

    // --- Nominatim search (подсказки)
    let debounceTimer = null;
    let lastQuery = "";

    function renderResults(items) {
      if (!items || items.length === 0) {
        resultsBox.style.display = "none";
        resultsBox.innerHTML = "";
        return;
      }

      resultsBox.style.display = "block";
      resultsBox.innerHTML = "";

      items.forEach(it => {
        const display = it.display_name || "";
        const div = document.createElement("div");
        div.className = "result";
        div.textContent = display;

        div.onclick = () => {
          const lat = parseFloat(it.lat);
          const lon = parseFloat(it.lon);

          // Жёстко запрещаем выбор, если не СПб/ЛО (доп. страховка)
          if (!isInSpbOrLo(display)) {
            selectedPlace = null;
            showWarn("Можно выбрать только адрес в Санкт-Петербурге или Ленинградской области.");
            renderResults([]);
            updateUI();
            return;
          }

          selectedPlace = {
            lat, lon,
            address: display,
            map_link: `https://maps.google.com/?q=${lat},${lon}`
          };

          showWarn("");
          renderResults([]);
          setMarker(lat, lon);
          map.flyTo({ center: [lon, lat], zoom: 16 });

          updateUI();
        };

        resultsBox.appendChild(div);
      });
    }

    async function searchSuggestions(q) {
      const query = (q || "").trim();
      if (query.length < 3) return [];

      // Важно: строго ограничиваем регионом через viewbox+bounded и дополнительно фильтруем по display_name
      const url =
        `https://nominatim.openstreetmap.org/search?format=jsonv2` +
        `&q=${encodeURIComponent(query)}` +
        `&limit=7&addressdetails=1` +
        `&countrycodes=ru` +
        `&viewbox=${VIEWBOX.left},${VIEWBOX.top},${VIEWBOX.right},${VIEWBOX.bottom}` +
        `&bounded=1`;

      try {
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];
        const data = await res.json();

        // Фильтрация: только СПб/ЛО
        const filtered = (data || []).filter(x => isInSpbOrLo(x.display_name));
        return filtered;
      } catch (e) {
        return [];
      }
    }

    addrInput.addEventListener("input", () => {
      const q = addrInput.value || "";

      // Если пользователь меняет текст после выбора — сбрасываем выбор
      if (selectedPlace && q.trim() !== (selectedPlace.address || "").trim()) {
        selectedPlace = null;
      }
      showWarn("");
      updateUI();

      const query = q.trim();
      if (query.length < 3) {
        renderResults([]);
        return;
      }

      // Debounce
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(async () => {
        // защита от гонок
        lastQuery = query;
        const items = await searchSuggestions(query);
        if (lastQuery !== query) return; // устарело
        renderResults(items);

        if (items.length === 0) {
          // адрес не найден -> запрет подтверждения
          selectedPlace = null;
          showWarn("Адрес не найден. Выберите существующий адрес из подсказок (только СПб/ЛО).");
          updateUI();
        }
      }, 300);
    });

    addrInput.addEventListener("focus", () => {
      // при фокусе — если есть что показывать, не скрываем
      if (resultsBox.innerHTML.trim()) resultsBox.style.display = "block";
    });

    document.addEventListener("click", (e) => {
      // скрываем подсказки, если кликнули вне списка и вне поля
      const isInside = resultsBox.contains(e.target) || addrInput.contains(e.target);
      if (!isInside) resultsBox.style.display = "none";
    });

    aptInput.addEventListener("input", () => {
      // квартира обязательна — обновляем состояние кнопки
      updateUI();
    });

    // Reverse geocode для перетаскивания маркера
    async function reverseGeocode(lat, lon) {
      try {
        const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return null;
        return await res.json();
      } catch (e) {
        return null;
      }
    }

    // Моё местоположение (как удобный помощник, но всё равно валидируем регион)
    btnMyLoc.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Геолокация недоступна на этом устройстве.");
        return;
      }
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        map.flyTo({ center: [lon, lat], zoom: 16 });
        setMarker(lat, lon);

        const rev = await reverseGeocode(lat, lon);
        if (!rev || !rev.display_name || !isInSpbOrLo(rev.display_name)) {
          selectedPlace = null;
          showWarn("Точка должна быть в Санкт-Петербурге или Ленинградской области. Введите адрес и выберите из подсказок.");
          updateUI();
          return;
        }

        selectedPlace = {
          lat, lon,
          address: rev.display_name,
          map_link: `https://maps.google.com/?q=${lat},${lon}`
        };
        addrInput.value = rev.display_name;
        showWarn("");
        renderResults([]);
        updateUI();
      }, () => {
        alert("Не удалось получить геопозицию. Проверьте разрешения.");
      }, { enableHighAccuracy: true, timeout: 8000 });
    });

    // Сброс
    btnClear.addEventListener("click", () => {
      selectedPlace = null;
      if (marker) { marker.remove(); marker = null; }
      addrInput.value = "";
      aptInput.value = "";
      renderResults([]);
      showWarn("");
      showOk("");
      updateUI();
      statusBadge.textContent = "Введите адрес и выберите из подсказок";
    });

    // Отправка в бота
    function sendToBot() {
      const apt = normalizeApartment(aptInput.value);

      if (!selectedPlace) {
        showWarn("Сначала выберите существующий адрес из подсказок (СПб/ЛО).");
        updateUI();
        return;
      }
      if (!apt) {
        showWarn("Введите номер квартиры (обязательно).");
        updateUI();
        return;
      }

      const payload = {
        lat: selectedPlace.lat,
        lon: selectedPlace.lon,
        address: `${selectedPlace.address}, кв. ${apt}`,
        apartment: apt,
        map_link: selectedPlace.map_link
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert("Откройте WebApp из Telegram. Данные:\n" + JSON.stringify(payload, null, 2));
      }
    }

    document.getElementById('btnConfirm').addEventListener('click', sendToBot);
    if (tg) tg.MainButton.onClick(sendToBot);

    // init UI state
    updateUI();
  </script>
</body>
</html>
