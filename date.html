<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Выбор даты</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 16px; }
    .card { padding: 14px; border: 1px solid #eee; border-radius: 14px; }
    label { display:block; font-size:14px; margin-bottom:6px; color:#444; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; }
    .hint { font-size: 13px; color:#666; margin-top:10px; line-height:1.35; }
  </style>
</head>
<body>
  <div class="card">
    <label for="d">Выберите дату доставки:</label>
    <input id="d" type="date" />
    <div class="hint">
      Нажмите на поле — откроется календарь. Потом нажмите кнопку “Подтвердить дату” внизу Telegram.
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    const input = document.getElementById('d');

    function todayISO() {
      const t = new Date();
      const yyyy = t.getFullYear();
      const mm = String(t.getMonth() + 1).padStart(2, '0');
      const dd = String(t.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // Минимальная дата = сегодня
    input.min = todayISO();
    input.value = todayISO();

    if (tg) {
      tg.expand();
      tg.ready();
      tg.MainButton.setText("✅ Подтвердить дату");
      tg.MainButton.show();

      tg.MainButton.onClick(() => {
        const date = (input.value || "").trim();
        if (!date) return;
        tg.sendData(JSON.stringify({ type: "date", date }));
        tg.close();
      });
    }
  </script>
</body>
</html>
